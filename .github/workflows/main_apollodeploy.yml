on:
  push:
    branches: [main, refatoracao]

name: Deploy InsightsApolo-Back

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/insightsapolo:back

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK - Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Build do Project
        working-directory: ./insightsApolo
        run: mvn -B clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

  deploy-back-1:
    needs: build
    runs-on: [self-hosted, "back_"]
    steps:
      - name: Info do runner
        run: |
          echo "Runner target: back_"
          hostname
          whoami

      - name: Liberar portas
        run: sudo ufw allow 8080/tcp && sudo ufw allow 3306/tcp || true

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull da imagem
        run: sudo docker pull "${{ env.IMAGE }}"

      - name: Stop & Remove containers antigos
        run: |
          TARGET_NAME="insightsApolo-back"
          TARGET_IMAGE="${{ env.IMAGE }}"
          sudo docker ps -a --filter "name=$TARGET_NAME" --format '{{.ID}}' | xargs -r sudo docker rm -f || true
          sudo docker ps -a --filter "ancestor=$TARGET_IMAGE" --format '{{.ID}}' | xargs -r sudo docker rm -f || true
          sudo docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | awk -v img="$TARGET_IMAGE" '$0 ~ img {print $2}' | xargs -r sudo docker rmi -f || true

      - name: Criar env file seguro + RabbitMQ check + rodar container
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/insightsApolo.env"
          mkdir -p "$RUNNER_TEMP"
          cat > "$ENV_FILE" <<'EOF'
          SPRING_PROFILES_ACTIVE=prod
          AWS_ACCESS_KEY_ID=${{ secrets._ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets._SECRET_KEY }}
          AWS_SESSION_TOKEN=${{ secrets._SESSION_TOKEN }}
          EOF

          sudo sed -i 's/\r$//' "$ENV_FILE" || true
          sudo chmod 600 "$ENV_FILE"

          RABBIT_PROPERTIES_FILE="$(pwd)/src/main/resources/application.properties"
          RABBIT_HOST=""
          RABBIT_PORT=""
          if [ -f "$RABBIT_PROPERTIES_FILE" ]; then
            RABBIT_HOST=$(grep -E '^spring.rabbitmq.host=' "$RABBIT_PROPERTIES_FILE" | sed 's/^spring.rabbitmq.host=//' | tr -d '\r' || true)
            RABBIT_PORT=$(grep -E '^spring.rabbitmq.port=' "$RABBIT_PROPERTIES_FILE" | sed 's/^spring.rabbitmq.port=//' | tr -d '\r' || true)
          fi
          RABBIT_HOST=${RABBIT_HOST:-localhost}
          RABBIT_PORT=${RABBIT_PORT:-5672}

          retries=5
          for i in $(seq 1 $retries); do
            if command -v nc >/dev/null 2>&1; then
              if nc -z -w3 "$RABBIT_HOST" "$RABBIT_PORT" >/dev/null 2>&1; then reachable=1; break; fi
            else
              if bash -c "cat < /dev/tcp/$RABBIT_HOST/$RABBIT_PORT" >/dev/null 2>&1; then reachable=1; break; fi
            fi
            sleep 2
          done

          if [ -z "${reachable+x}" ]; then
            echo "ERROR: RabbitMQ NOT reachable"
            exit 1
          fi

          sudo docker run -d --name insightsApolo-back \
            --add-host=host.docker.internal:host-gateway \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p 8080:8080 \
            "${{ env.IMAGE }}"

          if command -v shred >/dev/null 2>&1; then sudo shred -u "$ENV_FILE"; else sudo rm -f "$ENV_FILE"; fi

      - name: Logs finais
        run: sudo docker logs --tail 200 insightsApolo-back || true

  deploy-back-2:
    needs: build
    runs-on: [self-hosted, "back_2"]
    steps:
      - name: Info do runner
        run: |
          echo "Runner target: back_2"
          hostname
          whoami

      - name: Liberar portas
        run: sudo ufw allow 8080/tcp && sudo ufw allow 3306/tcp || true

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull da imagem
        run: sudo docker pull "${{ env.IMAGE }}"

      - name: Stop & Remove containers antigos
        run: |
          TARGET_NAME="insightsApolo-back"
          TARGET_IMAGE="${{ env.IMAGE }}"
          sudo docker ps -a --filter "name=$TARGET_NAME" --format '{{.ID}}' | xargs -r sudo docker rm -f || true
          sudo docker ps -a --filter "ancestor=$TARGET_IMAGE" --format '{{.ID}}' | xargs -r sudo docker rm -f || true
          sudo docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | awk -v img="$TARGET_IMAGE" '$0 ~ img {print $2}' | xargs -r sudo docker rmi -f || true

      - name: Criar env file seguro + RabbitMQ check + rodar container
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/insightsApolo.env"
          mkdir -p "$RUNNER_TEMP"
          cat > "$ENV_FILE" <<'EOF'
          SPRING_PROFILES_ACTIVE=prod
          AWS_ACCESS_KEY_ID=${{ secrets._ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets._SECRET_KEY }}
          AWS_SESSION_TOKEN=${{ secrets._SESSION_TOKEN }}
          EOF

          sudo chmod 600 "$ENV_FILE"

          # RabbitMQ check igual ao job anterior...
          RABBIT_PROPERTIES_FILE="$(pwd)/src/main/resources/application.properties"
          RABBIT_HOST=""
          RABBIT_PORT=""
          if [ -f "$RABBIT_PROPERTIES_FILE" ]; then
            RABBIT_HOST=$(grep -E '^spring.rabbitmq.host=' "$RABBIT_PROPERTIES_FILE" | sed 's/^spring.rabbitmq.host=//' | tr -d '\r' || true)
            RABBIT_PORT=$(grep -E '^spring.rabbitmq.port=' "$RABBIT_PROPERTIES_FILE" | sed 's/^spring.rabbitmq.port=//' | tr -d '\r' || true)
          fi
          RABBIT_HOST=${RABBIT_HOST:-localhost}
          RABBIT_PORT=${RABBIT_PORT:-5672}

          retries=5
          for i in $(seq 1 $retries); do
            if command -v nc >/dev/null 2>&1; then
              if nc -z -w3 "$RABBIT_HOST" "$RABBIT_PORT" >/dev/null 2>&1; then reachable=1; break; fi
            else
              if bash -c "cat < /dev/tcp/$RABBIT_HOST/$RABBIT_PORT" >/dev/null 2>&1; then reachable=1; break; fi
            fi
            sleep 2
          done

          if [ -z "${reachable+x}" ]; then
            echo "ERROR: RabbitMQ NOT reachable"
            exit 1
          fi

          sudo docker run -d --name insightsApolo-back \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p 8080:8080 \
            "${{ env.IMAGE }}"

          sudo rm -f "$ENV_FILE"

      - name: Logs finais
        run: sudo docker logs --tail 200 insightsApolo-back || true
