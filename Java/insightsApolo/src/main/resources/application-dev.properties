server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/apoloInsights
spring.datasource.username=root
spring.datasource.password=joao123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=false
#
#variaveis:
springdoc.swagger-ui.path=/docs
spring.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger.ui.defaultModelExpandDepth=1
api.security.token.expiration-time=24
cors.allowed.origin=http://localhost:3000,http://localhost:4200,http://localhost:5173

# RabbitMQ Configuration - Development
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=60000
